# 本机开发用中间件
# 主力环境：MySQL / RabbitMQ 连 Windows 主机（WSL 走 mirrored 网络，127.0.0.1 可直达）
# Redis：优先用主机的 6379；主机没开时用本 compose 的 redis 服务（映射到 6380，避免端口打架）
#
# 用法：
#   docker compose -f deploy/docker-compose.yml up -d
#   docker compose -f deploy/docker-compose.yml up -d redis   # 只起 Redis 兜底
#   docker compose -f deploy/docker-compose.yml ps
#   docker compose -f deploy/docker-compose.yml down          # 停容器，保留数据卷
#   docker compose -f deploy/docker-compose.yml down -v       # 连数据一起删
name: novel-dev

services:
  # Redis 兜底实例。
  # 为什么不映射 6379：主机上的 Redis 随时可能起来，两边抢同一个端口会启动失败。
  # 用 6380 后两者可以共存，应用侧改 spring.data.redis.port 即可切换。
  redis:
    image: redis:7-alpine
    container_name: novel-redis
    command: redis-server --appendonly yes --save 60 1
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  elasticsearch:
    # 从 deploy/es/Dockerfile 构建：在 8.13.0 上烤进 IK 分词插件。
    # 官方镜像不带 IK，直接建带 ik_max_word 的索引会被拒。
    # 构建失败（比如局域网拉不到插件）时，可临时把 novel.search.analyzer 改成 standard。
    build:
      context: ./es
      dockerfile: Dockerfile
    image: novel-es-ik:8.13.0
    container_name: novel-es
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.ml.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx1g
      - ingest.geoip.downloader.enabled=false
      - bootstrap.memory_lock=false
    ulimits:
      nofile: { soft: 65536, hard: 65536 }
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: novel-minio
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=novel
      - MINIO_ROOT_PASSWORD=novel12345
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # 控制台 http://127.0.0.1:9001
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  prometheus:
    # 抓 application.yml 里已暴露的 /actuator/prometheus。
    # 应用跑在宿主机（mvn spring-boot:run）而不是容器里，所以要走 host-gateway 才能回连；
    # 少这一行，面板上会一直是一条 DOWN，且报错只有 "connection refused"，很难往网络方向想。
    # 版本固定，不用 latest：latest 一升级，面板里查不到指标时很难判断是代码问题还是版本变了
    image: prom/prometheus:v2.54.1
    container_name: novel-prometheus
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      # 7 天够看"昨天下午那次压测"，再长就是在本地攒垃圾
      - --storage.tsdb.retention.time=7d
    restart: unless-stopped

  grafana:
    # 端口映射到 3001：3000 常被别的本地服务（Loki、Langfuse 之类）占着，
    # 抢端口会让人以为是 Grafana 装坏了
    image: grafana/grafana:11.3.0
    container_name: novel-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=novel
      - GF_SECURITY_ADMIN_PASSWORD=novel12345
      - GF_USERS_ALLOW_SIGN_UP=false
      # 面板与数据源全部由文件预置，第一次打开就有图，不需要手工点 "Add data source"
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  es-data:
  minio-data:
  redis-data:
  prometheus-data:
  grafana-data:
